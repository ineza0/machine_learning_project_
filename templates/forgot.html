
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot Password | StudentPredict</title>
<style>
:root {
  --blue:#075cf5; --bg:#f1f6ff; --card:#fff; --ink:#102344;
  --muted:#64748b; --line:#d5e2ff; --field:#fff;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;
font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--blue);text-decoration:none}
header{background:linear-gradient(110deg,#0876ff,#0746b8);color:white;
padding:18px 5%;display:flex;justify-content:space-between;
align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-size:24px;font-weight:800;color:white}
.tools{display:flex;gap:10px}
select,.theme{padding:9px;border:0;border-radius:8px;cursor:pointer}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:35px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;
padding:35px;width:100%;max-width:480px;
box-shadow:0 15px 45px #0a347d12}
.logo{text-align:center;font-size:48px}
h1{text-align:center;font-size:29px;margin:12px 0}
p{color:var(--muted);line-height:1.6;text-align:center}
label{display:block;font-weight:700;margin:22px 0 9px;font-size:14px}
input{width:100%;padding:14px;border:1px solid var(--line);
border-radius:9px;background:var(--field);color:var(--ink);font-size:15px}
input:focus{outline:2px solid #8ab8ff}
button{width:100%;padding:14px;margin-top:18px;border:0;border-radius:9px;
background:var(--blue);color:white;font-weight:750;font-size:16px;cursor:pointer}
button:disabled{opacity:.6}
.msg{display:none;padding:12px;border-radius:8px;margin-top:15px;
font-size:14px;line-height:1.5}
.error{background:#fff0f1;color:#a21d32}
.success{background:#eafaf0;color:#08753a}
.back{text-align:center;margin-top:22px;font-size:14px}
footer{background:#08275a;color:#e0eaff;text-align:center;padding:18px;
font-size:13px;line-height:1.9}
footer a{color:white}
.dark{--bg:#0b1220;--card:#121e32;--ink:#eef4ff;
--muted:#b2c1de;--line:#293d5e;--field:#101a2c}
@media(max-width:500px){.card{padding:24px}.brand{font-size:20px}}
</style>
</head>
<body>
<header>
  <a class="brand" href="/login">🎓 StudentPredict</a>
  <div class="tools">
    <select id="language" aria-label="Language">
      <option value="en">English</option>
      <option value="rw">Kinyarwanda</option>
      <option value="fr">Français</option>
    </select>
    <button class="theme" id="theme" type="button"
    style="width:auto;margin:0;padding:9px">☀️ / 🌙</button>
  </div>
</header>

<main>
<section class="card">
  <div class="logo">🔐</div>
  <h1 data-en="Forgot password?" data-rw="Wibagiwe ijambo ry'ibanga?"
  data-fr="Mot de passe oublié ?">Forgot password?</h1>
  <p data-en="Enter the email associated with your account. If the account is eligible, you will receive instructions to reset your password."
  data-rw="Andika email ukoresha muri konti yawe. Niba konti yemerewe, urahabwa amabwiriza yo guhindura ijambo ry'ibanga."
  data-fr="Saisissez l'adresse e-mail associée à votre compte. Si le compte est éligible, vous recevrez les instructions de réinitialisation.">
  Enter the email associated with your account. If the account is eligible, you will receive instructions to reset your password.
  </p>

  <div class="msg error" id="error" role="alert"></div>
  <div class="msg success" id="success" role="status"></div>

  <form id="forgotForm" method="post" action="/forgot">
    <label for="email" data-en="Email address" data-rw="Email yawe"
    data-fr="Adresse e-mail">Email address</label>
    <input type="email" id="email" name="email" autocomplete="email"
    placeholder="you@example.com" required>

    <button id="submitBtn" type="submit"
    data-en="Send reset instructions"
    data-rw="Ohereza amabwiriza yo guhindura password"
    data-fr="Envoyer les instructions">Send reset instructions</button>
  </form>

  <div class="back">
    <a href="/login" data-en="← Back to Login"
    data-rw="← Subira kuri Login" data-fr="← Retour à la connexion">
    ← Back to Login</a>
  </div>
</section>
</main>

<footer>
  <strong>StudentPredict</strong><br>
  <a href="tel:+250798555810">☎ 0798555810</a><br>
  <a href="mailto:tuyishimeeric139@gmail.com">✉ tuyishimeeric139@gmail.com</a><br>
  © 2026 StudentPredict
</footer>

<script>
const language = document.getElementById("language");

function setLanguage(value) {
  document.documentElement.lang = value;
  document.querySelectorAll("[data-en]").forEach(el => {
    el.textContent = el.dataset[value] || el.dataset.en;
  });
  try { localStorage.setItem("studentpredict-language", value); } catch(e) {}
}

try {
  language.value = localStorage.getItem("studentpredict-language") || "en";
} catch(e) {}
setLanguage(language.value);
language.addEventListener("change", () => setLanguage(language.value));

function setTheme(value) {
  document.body.classList.toggle("dark", value === "dark");
  try { localStorage.setItem("studentpredict-theme", value); } catch(e) {}
}
try {
  setTheme(localStorage.getItem("studentpredict-theme") || "light");
} catch(e) { setTheme("light"); }

document.getElementById("theme").addEventListener("click", () => {
  setTheme(document.body.classList.contains("dark") ? "light" : "dark");
});

document.getElementById("forgotForm").addEventListener("submit", async e => {
  e.preventDefault();

  const error = document.getElementById("error");
  const success = document.getElementById("success");
  const btn = document.getElementById("submitBtn");
  error.style.display = "none";
  success.style.display = "none";
  btn.disabled = true;

  try {
    const response = await fetch("/forgot", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json"
      },
      body: JSON.stringify({
        email: document.getElementById("email").value.trim()
      })
    });

    const data = await response.json();

    if (!response.ok || data.success === false) {
      throw new Error(data.error || data.message ||
        "Unable to process the request. Please try again.");
    }

    success.textContent = data.message ||
      "If your account is eligible, reset instructions will be sent.";
    success.style.display = "block";
  } catch (err) {
    error.textContent = err.message ||
      "A connection error occurred. Please try again.";
    error.style.display = "block";
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
